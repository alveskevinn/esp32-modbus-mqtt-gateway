; ESP32 Modbus RTU -> MQTT gateway
;
;   pio run -e esp32dev -t upload       # classic ESP32 (DevKit V1, WROOM-32)
;   pio run -e esp32c3 -t upload        # ESP32-C3 SuperMini / DevKitM-1
;   pio test -e native                  # register decoding unit tests (host)
;
; Pins and defaults live in include/config.h and can be overridden here with -D.

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -Wall

[env:esp32dev]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:esp32c3]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
lib_deps = ${common.lib_deps}
; Native USB CDC for the serial console; UART1 stays free for RS-485.
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRS485_RX_GPIO=6
    -DRS485_TX_GPIO=7
    -DRS485_DE_GPIO=10
    -DPORTAL_BUTTON_GPIO=9

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
